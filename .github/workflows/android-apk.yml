name: Build and publish APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Restore stable APK signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing ANDROID_DEBUG_KEYSTORE_BASE64 secret'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Test, lint, and build APK
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PapkVersionCode=$((1000 + GITHUB_RUN_NUMBER))
      - name: Sign published APK with stable key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$signer" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk"
          expected="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)"
          actual="$("$signer" verify --print-certs "$apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = "$expected" || { echo 'APK signing certificate does not match the saved key'; exit 1; }
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sinkpoint.apk
          cd dist
          sha256sum sinkpoint.apk > sinkpoint.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sinkpoint-apk-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automatic Sinkpoint build from commit ${GITHUB_SHA}.

          Download **sinkpoint.apk** and open it on Android 8.0 or later. Allow installation from your browser or file manager when Android asks.

          This is a debug-signed preview build. Its stable signing key allows updates over previous Sinkpoint preview builds.
          EOF
          gh release create "$tag" dist/sinkpoint.apk dist/sinkpoint.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sinkpoint build ${GITHUB_RUN_NUMBER}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
